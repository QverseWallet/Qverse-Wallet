<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Qverse Wallet — Settings</title>
<link rel="stylesheet" href="options.css"/></head>
<body>
  <div class="wrap">
    <h2>Qverse Wallet — Settings</h2>

    <!--
      These endpoints used to be editable text inputs. The values were written
      to storage but never read: background/service-worker.js has always used
      hardcoded URLs, so "Save" changed nothing. They are shown read-only now.

      They are deliberately not configurable: pointing the broadcast endpoint at
      an arbitrary host would hand signed transactions to whoever controls it.
      The reachable hosts are pinned in manifest.json under host_permissions.
    -->
    <div class="card">
      <h3>Network endpoints</h3>
      <p class="muted">Fixed in this build. Listed here so you can verify where the wallet talks.</p>
      <div class="field">
        <label for="qtcBroadcastUrl">Broadcast</label>
        <input id="qtcBroadcastUrl" readonly/>
      </div>
      <div class="field">
        <label for="qtcBalanceUrl">Address / balance API</label>
        <input id="qtcBalanceUrl" readonly/>
      </div>
      <div class="field">
        <label for="qtcPriceUrl">Price feed</label>
        <input id="qtcPriceUrl" readonly/>
      </div>
    </div>

    <div class="card">
      <h3>Auto-lock</h3>
      <p class="muted">Configured from the wallet popup, under the gear menu.</p>
      <div class="field">
        <label for="autolockCurrent">Current setting</label>
        <input id="autolockCurrent" readonly/>
      </div>
    </div>
  </div>
  <script src="options.js"></script>
</body></html>
